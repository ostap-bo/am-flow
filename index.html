];

function viewSettings(tab) {
  tab = SETTINGS_TABS.some(t => t.id === tab) ? tab : 'flow';
  const body = tab === 'fields' ? viewSetFields() : tab === 'vars' ? viewSetVars() : tab === 'data' ? viewSetData() : viewSetFlow();
  return `<div class="page">
    <div class="page-head"><div><h1 class="page-title">Налаштування</h1><div class="page-sub">Спільні для всіх клієнтів: флоу, поля картки, шаблони й дані</div></div></div>
    <div class="settings-layout">
      <nav class="settings-nav">${SETTINGS_TABS.map(t => `<a class="nav-item ${tab === t.id ? 'active' : ''}" href="#/settings/${t.id}">${icon(t.ic, 16)}${t.label}</a>`).join('')}</nav>
      <div>${body}</div>
    </div>
  </div>`;
}

/* ---------- flow ---------- */
function viewSetFlow() {
  const st = S.settings.stages;
  const nTasks = st.reduce((n, s) => n + s.tasks.length, 0);
  return `
    <div class="row wrap" style="align-items:flex-start;margin-bottom:16px">
      <div style="flex:1;min-width:240px"><h2 class="section-title">Флоу етапів</h2>
        <p class="section-sub" style="margin:0">${st.length} ${plural(st.length, 'етап', 'етапи', 'етапів')} · ${nTasks} ${plural(nTasks, 'пункт', 'пункти', 'пунктів')}. Зміни одразу діють для всіх клієнтів, позначений прогрес зберігається.</p></div>
      <button class="btn" data-act="importFlow">${icon('upload', 15)}Імпорт флоу</button>
      <button class="btn primary" data-act="addStage">${icon('plus', 15)}Етап</button>
    </div>
    ${!st.length ? `<div class="card">${emptyState({ ic: 'layers', title: 'Флоу поки порожній', text: 'Імпортуйте готову чернетку з файлу <b>.json</b> або створіть перший етап вручну. Наприклад: «Отримання клієнта і привітання».', actions: `<div class="row" style="justify-content:center"><button class="btn primary" data-act="importFlow">${icon('upload', 16)}Імпортувати з файлу</button><button class="btn" data-act="addStage">${icon('plus', 16)}Створити етап</button></div>` })}</div>` : ''}
    <div data-sortlist="stages">
    ${st.map((s, i) => `
      <div class="card flow-stage" data-sort="stage" data-id="${s.id}">
        <div class="fs-head">
          <span class="drag" data-drag title="Перетягніть, щоб змінити порядок">${icon('grip', 16)}</span>
          <div class="stage-num">${i + 1}</div>
          <div class="fs-title">
            <input class="inline-input" data-in="stTitle" data-sid="${s.id}" value="${esc(s.title)}" aria-label="Назва етапу" placeholder="Назва етапу">
            <input class="inline-input desc" data-in="stDesc" data-sid="${s.id}" value="${esc(s.description)}" placeholder="Короткий опис етапу (необов'язково)" aria-label="Опис етапу">
          </div>
          ${s.optional ? '<span class="badge violet" title="Вмикається при створенні клієнта">Необов\'язковий</span>' : ''}
          <span class="badge">${s.tasks.length}</span>
          <button class="icon-btn sm" data-act="fsStageMenu" data-sid="${s.id}" aria-label="Дії з етапом">${icon('more', 17)}</button>
        </div>
        <div class="fs-tasks" data-sortlist="tasks" data-sid="${s.id}">
          ${s.tasks.map(t => {
            const nT = t.attachments.filter(a => a.kind === 'text').length, nF = t.attachments.filter(a => a.kind === 'file').length, nL = t.attachments.filter(a => a.kind === 'link').length;
            return `<div class="fs-task ${S.ui.settingsTask === t.id ? 'selected' : ''}" data-sort="task" data-id="${t.id}" data-sid="${s.id}" data-act="editTask" data-tid="${t.id}" tabindex="0" role="button">
              <span class="drag" data-drag title="Перетягніть">${icon('grip', 15)}</span>
              <span class="tt">${esc(t.title)}</span>
              <span class="meta">
                ${nT ? `<span class="it" title="Шаблони повідомлень">${icon('msg', 13)}${nT}</span>` : ''}
                ${nF ? `<span class="it" title="Файли">${icon('clip', 13)}${nF}</span>` : ''}
                ${nL ? `<span class="it" title="Посилання">${icon('link', 13)}${nL}</span>` : ''}
                ${t.dueDays !== null && t.dueDays !== undefined ? `<span class="it" title="Рекомендований термін">${icon('clock', 13)}+${t.dueDays} дн.</span>` : ''}
              </span>
              ${icon('chevR', 15)}
            </div>`; }).join('')}
        </div>
        <button class="add-task" data-act="addTask" data-sid="${s.id}">${icon('plus', 15)}Додати пункт</button>
      </div>`).join('')}
    </div>`;
}

function renderDrawer() {
  let wrap = $('#drawer');
  const found = S.ui.settingsTask && findTask(S.ui.settingsTask);
  if (!found) { if (wrap) wrap.remove(); return; }
  const { st, t } = found;
  const keepScroll = wrap ? $('.drawer-body', wrap).scrollTop : 0;
  const focusedId = document.activeElement && document.activeElement.id;
  const html = `
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-t">
      <div class="drawer-head"><div class="t" id="dr-t">Пункт флоу</div><span class="badge blue" style="max-width:220px;overflow:hidden;text-overflow:ellipsis">${esc(st.title)}</span>
        <button class="icon-btn" data-act="closeDrawer" aria-label="Закрити">${icon('x', 18)}</button></div>
      <div class="drawer-body">
        <div class="field"><label class="label" for="t-title">Назва пункту</label><input class="input" id="t-title" data-in="tTitle" value="${esc(t.title)}"></div>
        <div class="field"><label class="label" for="t-desc">Інструкція</label><textarea class="textarea" id="t-desc" data-in="tDesc" rows="3" placeholder="Як саме виконати цей крок, на що звернути увагу">${esc(t.description)}</textarea><div class="hint">Видно в картці клієнта, коли розгортаєте пункт.</div></div>
        <div class="field"><label class="label" for="t-due">Рекомендований термін</label>
          <div class="row"><input type="number" min="0" max="365" class="input" id="t-due" data-in="tDue" style="width:100px" value="${t.dueDays ?? ''}" placeholder="—"><span class="muted">днів від дати старту клієнта</span></div>
          <div class="hint">Порожньо — без терміну. 0 — у день старту. У картці клієнта термін можна змінити.</div></div>
        <div style="border-top:1px solid var(--border);margin:20px 0 16px"></div>
        <div class="row" style="margin-bottom:4px"><div class="section-title" style="font-size:15px">Матеріали</div></div>
        <p class="section-sub" style="font-size:13px">Шаблони повідомлень мовами УКР / РУС / ENG, файли й посилання для цього кроку. У картці клієнта поруч буде кнопка «Копіювати».</p>
        ${t.attachments.map((a, i) => attEditHtml(a, i, t.attachments.length)).join('')}
        <div class="row wrap">
          <button class="btn soft sm" data-act="addAtt" data-kind="text">${icon('msg', 14)}Шаблон повідомлення</button>
          <button class="btn sm" data-act="addAtt" data-kind="file">${icon('clip', 14)}Файл</button>
          <button class="btn sm" data-act="addAtt" data-kind="link">${icon('link', 14)}Посилання</button>
        </div>
        <div style="border-top:1px solid var(--border);margin:24px 0 16px"></div>
        <button class="btn ghost sm" style="color:var(--danger)" data-act="delTask">${icon('trash', 14)}Видалити пункт з флоу</button>
      </div>
      <div class="drawer-foot">${icon('checkCircle', 15)}<span>Зміни зберігаються автоматично</span><span class="sp"></span><button class="btn primary sm" data-act="closeDrawer">Готово</button></div>
    </aside>`;
  if (!wrap) {
    wrap = document.createElement('div'); wrap.id = 'drawer'; wrap.className = 'drawer-wrap';
    wrap.addEventListener('mousedown', e => { if (e.target === wrap) closeDrawer(); });
    document.body.appendChild(wrap);
    wrap.innerHTML = html;
    setTimeout(() => { const ti = $('#t-title'); if (ti && t.title === 'Новий пункт') { ti.focus(); ti.select(); } }, 40);

}
function closeDrawer() { S.ui.settingsTask = null; const w = $('#drawer'); if (w) w.remove(); render(); }

        </div>
        <textarea class="textarea" rows="7" id="att-${a.id}-${lang}" data-in="aText" data-aid="${a.id}" data-lang="${lang}" placeholder="${lang === 'uk' ? 'Текст шаблону українською' : lang === 'ru' ? 'Текст шаблона на русском' : 'Template text in English'}">${esc(a.texts[lang] || '')}</textarea>
        <div class="var-chips"><span class="lbl">Вставити:</span>${varKeys().map(v => `<button type="button" class="chip-btn" data-act="insVar" data-aid="${a.id}" data-key="${esc(v.key)}" title="${esc(v.label)}">{{${esc(v.key)}}}</button>`).join('')}<a href="#/settings/vars" class="muted" style="font-size:12px;margin-left:4px" data-act="closeDrawerLink">Керувати змінними</a></div>

    return `<div class="att-edit"><div class="att-edit-head">${icon('file', 15)}<div style="flex:1;min-width:0;padding:0 4px"><div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.name)}</div><div class="muted" style="font-size:12px">${fmtSize(a.size || 0)}</div></div>

/* ---------- drag & drop reordering ---------- */
function setupSortables(root) {
  let drag = null;
  const clearMarks = () => $$('.drop-before,.drop-after', root).forEach(x => x.classList.remove('drop-before', 'drop-after'));
  root.addEventListener('mousedown', e => {
    const h = e.target.closest('[data-drag]'); if (!h) return;
    const item = h.closest('[data-sort]'); if (item) item.draggable = true;
  });
  root.addEventListener('mouseup', () => $$('[data-sort][draggable=true]', root).forEach(x => { if (!drag) x.draggable = false; }));
  root.addEventListener('dragstart', e => {
    const item = e.target.closest && e.target.closest('[data-sort]');
    if (!item || item.draggable !== true) return;
    drag = { type: item.dataset.sort, id: item.dataset.id, el: item, target: null };
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', item.dataset.id); } catch {}
    setTimeout(() => item.classList.add('dragging'), 0);
  });
  root.addEventListener('dragover', e => {
    if (!drag) return;
    clearMarks();
    const over = e.target.closest(`[data-sort="${drag.type}"]`);
    if (over && over !== drag.el) {
      e.preventDefault();
      const r = over.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2;
      over.classList.add(after ? 'drop-after' : 'drop-before');
      drag.target = { id: over.dataset.id, after, sid: over.dataset.sid };
      return;
    }
    if (!over && drag.type === 'task') {
      const list = e.target.closest('[data-sortlist="tasks"]') || (e.target.closest('.flow-stage') && $('[data-sortlist="tasks"]', e.target.closest('.flow-stage')));
      if (list) { e.preventDefault(); drag.target = { id: null, after: true, sid: list.dataset.sid }; list.classList.add('drop-after'); return; }
    }
    if (over === drag.el) { e.preventDefault(); drag.target = null; }
  });
  root.addEventListener('drop', e => {
    if (!drag) return; e.preventDefault();
    const d = drag; clearMarks();
    if (d.target) applyReorder(d);
  });
  root.addEventListener('dragend', () => { clearMarks(); if (drag) { drag.el.classList.remove('dragging'); drag.el.draggable = false; } drag = null; });
}
function moveInArray(arr, id, targetId, after) {
  const from = arr.findIndex(x => x.id === id); if (from < 0) return;
  const [it] = arr.splice(from, 1);
  let to = targetId ? arr.findIndex(x => x.id === targetId) : arr.length - 1;
  if (to < 0) to = arr.length - 1;
  arr.splice(after ? to + 1 : to, 0, it);
}
function applyReorder(d) {
  const t = d.target;
  updateSettings(s => {
    if (d.type === 'stage') moveInArray(s.stages, d.id, t.id, t.after);
    if (d.type === 'field') moveInArray(s.fields, d.id, t.id, t.after);
    if (d.type === 'task') {
      const src = s.stages.find(st => st.tasks.some(x => x.id === d.id));
      const dst = s.stages.find(st => st.id === t.sid);
      if (!src || !dst) return;
      const idx = src.tasks.findIndex(x => x.id === d.id);
      const [task] = src.tasks.splice(idx, 1);
      let to = t.id ? dst.tasks.findIndex(x => x.id === t.id) : dst.tasks.length;
      if (to < 0) to = dst.tasks.length;
      dst.tasks.splice(t.id && t.after ? to + 1 : to, 0, task);
    }
  });
}

  main.innerHTML = html;

  document.title = (title ? title + ' · ' : '') + 'AM Flow';
  if (focus) {
    const el = document.getElementById(focus.id);
    if (el) { el.focus({ preventScroll: true }); try { if (focus.s != null) el.setSelectionRange(focus.s, focus.e); } catch {} }
  }
  $$('.inline-input.auto', main).forEach(autosize);
  if (S.ui.scrollTo) {
    const el = document.getElementById(S.ui.scrollTo); S.ui.scrollTo = null;

}
function autosize(el) { el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; }
document.addEventListener('input', e => { if (e.target.matches && e.target.matches('.inline-input.auto')) autosize(e.target); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && e.target.matches && e.target.matches('textarea[data-single]')) { e.preventDefault(); e.target.blur(); } });
window.addEventListener('resize', debounce(() => $$('.inline-input.auto').forEach(autosize), 150));
function softRender() {
  const a = document.activeElement;

  render();
}
document.addEventListener('focusout', () => setTimeout(() => {

}, 0));
function updateSyncEl() {
  const el = $('.sync'); if (!el) return;

  el.className = 'sync ' + (S.sync === 'local' ? 'offline' : S.sync);
  el.title = labels[S.sync] || ''; el.lastElementChild.textContent = labels[S.sync] || '';
}
function onRemote(ev) {
  if (ev.type === 'settings') {
    if ((ev.data.updatedAt || 0) <= (S.settings.updatedAt || 0)) return;
    S.settings = normalizeSettings(clone(ev.data));
  } else if (ev.type === 'client') {
    const local = S.clients.get(ev.data.id);
    if (local && (clientTimers.has(local.id) || (ev.data.updatedAt || 0) <= (local.updatedAt || 0))) return;
    S.clients.set(ev.data.id, normalizeClient(clone(ev.data)));
  } else if (ev.type === 'clientRemoved') {
    if (!S.clients.has(ev.id)) return;
    S.clients.delete(ev.id);
  }
  if (S.ui.settingsTask && $('#drawer') && document.activeElement && $('#drawer').contains(document.activeElement)) return;
  softRender();
}

  async toggleDone(el) {
    const c = curClient(); if (!c) return;
    const tid = el.dataset.tid, p = taskState(c, tid), title = taskTitle(c, tid);
    if (p.skipped) return;
    const statsOf = () => progressOf(c).stats.find(s => s.stage.tasks.some(t => t.id === tid));
    if (p.done) {
      const ok = await confirmDialog({ title: 'Зняти позначку «Виконано»?', text: `Пункт «${esc(title)}» знову стане невиконаним${p.doneAt ? `, дату виконання (${fmtTs(p.doneAt)}) буде видалено` : ''}.`, confirm: 'Зняти позначку', tone: 'amber', ic: 'undo' });
      if (!ok) return;
      updateClient(c.id, x => { const q = x.progress[tid] || (x.progress[tid] = {}); q.done = false; delete q.doneAt; }, { log: { type: 'undone', text: `Знято позначку: «${title}»` } });
      return;
    }
    const before = statsOf();
    updateClient(c.id, x => { const q = x.progress[tid] || (x.progress[tid] = {}); q.done = true; q.doneAt = Date.now(); }, { log: { type: 'done', text: `Виконано: «${title}»` }, render: false });
    const after = statsOf();
    if (before && after && !before.complete && after.complete) {
      logTo(c, 'stage', `Етап «${after.stage.title}» завершено`);
      toast(`Етап «${after.stage.title}» завершено 🎉`);
    }
    render();
  },

  closeDrawer: () => closeDrawer(),
  closeDrawerLink: () => { S.ui.settingsTask = null; const w = $('#drawer'); w && w.remove(); },
  async addAtt(el) {
    const f = findTask(S.ui.settingsTask); if (!f) return;
    const kind = el.dataset.kind;
    if (kind === 'text') {
      const id = uid('a_');
      updateSettings(() => f.t.attachments.push({ id, kind: 'text', title: 'Новий шаблон', texts: { uk: '', ru: '', en: '' } }), { render: false });
      renderDrawer();
      const inp = $(`#drawer [data-in=aTitle][data-aid="${id}"]`); if (inp) { inp.scrollIntoView({ block: 'center' }); inp.focus(); inp.select(); }
    } else if (kind === 'link') {
      const id = uid('a_');
      updateSettings(() => f.t.attachments.push({ id, kind: 'link', title: '', url: '' }), { render: false });
      renderDrawer();
      const inp = $(`#drawer [data-in=aTitle][data-aid="${id}"]`); inp && inp.focus();
    } else {
      const file = await pickFile(); if (!file) return;
      if (file.size > MAX_FILE) return toast(`Файл завеликий: максимум ${fmtSize(MAX_FILE)}`, { error: true });
      try {
        toast(`Завантажую «${file.name}»…`, { ms: 2000 });
        const meta = await S.store.uploadFile(file, file.name, file.type);
        updateSettings(() => f.t.attachments.push({ id: uid('a_'), kind: 'file', fileId: meta.id, name: meta.name, size: meta.size, type: meta.type }), { render: false });
        renderDrawer(); toast('Файл додано');
      } catch (e) { toast('Не вдалося завантажити: ' + e.message, { error: true }); }
    }
  },
  attMove(el) {
    const f = findTask(S.ui.settingsTask); if (!f) return;
    const arr = f.t.attachments, i = arr.findIndex(a => a.id === el.dataset.aid), j = i + Number(el.dataset.dir);
    if (i < 0 || j < 0 || j >= arr.length) return;
    updateSettings(() => { const [x] = arr.splice(i, 1); arr.splice(j, 0, x); }, { render: false });
    renderDrawer();
  },
  async attDel(el) {
    const f = findTask(S.ui.settingsTask); if (!f) return;
    const a = f.t.attachments.find(x => x.id === el.dataset.aid); if (!a) return;
    const hasContent = a.kind === 'file' || (a.kind === 'text' && Object.values(a.texts).some(Boolean));

    if (a.kind === 'file') S.store.deleteFile(a.fileId);

async function uploadClientFiles(files) {
  const c = curClient(); if (!c) return;
  for (const file of files) {
    if (file.size > MAX_FILE) { toast(`«${file.name}» завеликий: максимум ${fmtSize(MAX_FILE)}`, { error: true }); continue; }
    try {
      toast(`Завантажую «${file.name}»…`, { ms: 2000 });
      const meta = await S.store.uploadFile(file, file.name, file.type);
      updateClient(c.id, x => x.files.push({ id: meta.id, name: meta.name, size: meta.size, type: meta.type, createdAt: meta.createdAt }), { log: { type: 'file', text: `Додано файл «${meta.name}»` } });
      toast('Файл додано');
    } catch (e) { toast('Не вдалося завантажити: ' + e.message, { error: true }); }
  }
}

document.addEventListener('click', e => {

  if (el.closest('.modal-wrap') || el.closest('.auth')) return;

document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act]:not(button)') && !e.target.closest('.modal-wrap')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.id === 'note-new') { e.preventDefault(); ACTIONS.addNote(); return; }
  if (e.key === 'Escape' && !modalStack.length && !openMenuEl) {

  }

/* ---------- backup / flow import-export ---------- */
function fileNameById(id) {
  for (const st of S.settings.stages) for (const t of st.tasks) for (const a of t.attachments) if (a.kind === 'file' && a.fileId === id) return a.name;
  for (const c of S.clients.values()) for (const f of c.files) if (f.id === id) return f.name;
  return 'file';
}
async function packFiles(ids) {
  const out = [];
  for (const id of ids) {
    try { const blob = await S.store.downloadFile(id); out.push({ id, name: fileNameById(id), type: blob.type, b64: await blobToB64(blob) }); }
    catch (e) { console.warn('skip file', id, e); }
  }
  return out;
}
async function exportBackup(withFiles) {
  const data = { type: 'amflow-backup', version: 1, exportedAt: new Date().toISOString(), settings: clone(S.settings), clients: [...S.clients.values()].map(clone), files: [] };
  if (withFiles) { toast('Готую копію разом із файлами…', { ms: 2500 }); data.files = await packFiles(collectFileIds()); }
  downloadBlob(new Blob([JSON.stringify(data)], { type: 'application/json' }), `amflow-backup-${todayISO()}.json`);
  toast('Резервну копію збережено');
}
async function exportFlow() {
  const ids = new Set(); S.settings.stages.forEach(st => st.tasks.forEach(t => t.attachments.forEach(a => a.kind === 'file' && ids.add(a.fileId))));
  const data = { type: 'amflow-flow', version: 1, exportedAt: new Date().toISOString(), stages: clone(S.settings.stages), fields: clone(S.settings.fields), vars: clone(S.settings.vars), files: await packFiles(ids) };
  downloadBlob(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }), `amflow-flow-${todayISO()}.json`);
  toast('Флоу експортовано');
}
async function restoreFiles(files) {
  let n = 0;
  for (const f of files || []) {
    try { await S.store.uploadFile(b64ToBlob(f.b64, f.type), f.name, f.type, f.id); n++; }
    catch (e) { console.warn('file restore failed', f.name, e); toast(`Файл «${f.name}» не відновлено: ${e.message}`, { error: true }); }
  }
  return n;
}
async function importFromFile(expect) {
  const file = await pickFile('.json,application/json'); if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch { return toast('Це не схоже на файл AM Flow (.json)', { error: true }); }
  if (data.type === 'amflow-flow' || (expect === 'flow' && data.type === 'amflow-backup')) return importFlowData(data.type === 'amflow-backup' ? { ...data.settings, files: data.files } : data, file.name);
  if (data.type === 'amflow-backup') return importBackupData(data);
  toast('Файл не розпізнано: очікується флоу або резервна копія AM Flow', { error: true });
}
async function importFlowData(data, fname) {
  const n = (data.stages || []).reduce((a, s) => a + (s.tasks || []).length, 0);
  const ok = await confirmDialog({
    title: 'Імпортувати флоу?', ic: 'upload', tone: 'primary', confirm: 'Імпортувати',
    text: `«${esc(fname)}»: ${(data.stages || []).length} ${plural((data.stages || []).length, 'етап', 'етапи', 'етапів')}, ${n} ${plural(n, 'пункт', 'пункти', 'пунктів')}, ${(data.fields || []).length} полів. Поточні етапи, шаблони й поля буде замінено. Позначки клієнтів збережуться для пунктів, які є в обох версіях.`,
  });
  if (!ok) return;
  const oldFiles = new Set(); S.settings.stages.forEach(st => st.tasks.forEach(t => t.attachments.forEach(a => a.kind === 'file' && oldFiles.add(a.fileId))));
  const restored = await restoreFiles(data.files);
  const incoming = normalizeSettings({ stages: clone(data.stages || []), fields: clone(data.fields || S.settings.fields), vars: clone(data.vars || []) });
  const merged = incoming.vars.map(v => { const old = S.settings.vars.find(o => o.key === v.key); return old && old.value && !v.value ? { ...v, value: old.value } : v; });
  S.settings.vars.forEach(o => { if (o.key && !merged.some(v => v.key === o.key)) merged.push(o); });
  updateSettings(s => { s.stages = incoming.stages; s.fields = incoming.fields; s.vars = merged; });
  const keep = new Set(); S.settings.stages.forEach(st => st.tasks.forEach(t => t.attachments.forEach(a => a.kind === 'file' && keep.add(a.fileId))));
  oldFiles.forEach(id => { if (!keep.has(id)) S.store.deleteFile(id); });
  toast(`Флоу імпортовано${restored ? `, файлів: ${restored}` : ''}`);
}
async function importBackupData(data) {
  const cnt = (data.clients || []).length;
  const ok = await confirmDialog({
    title: 'Відновити з резервної копії?', confirm: 'Замінити все', ic: 'refresh', tone: 'danger',
    text: `Копія від ${data.exportedAt ? fmtTsFull(Date.parse(data.exportedAt)) : '—'}: ${cnt} ${plural(cnt, 'клієнт', 'клієнти', 'клієнтів')}. Поточні дані (${S.clients.size} ${plural(S.clients.size, 'клієнт', 'клієнти', 'клієнтів')}, флоу й поля) буде замінено вмістом копії.`,
  });
  if (!ok) return;
  toast('Відновлюю дані…', { ms: 2500 });
  const incomingIds = new Set((data.clients || []).map(c => c.id));
  for (const c of S.clients.values()) if (!incomingIds.has(c.id)) S.store.deleteClient(c.id);
  S.clients.clear();
  const now = Date.now();
  S.settings = normalizeSettings(clone(data.settings)); S.settings.updatedAt = now; S.store.saveSettings(clone(S.settings));
  (data.clients || []).forEach(raw => { const c = normalizeClient(clone(raw)); c.updatedAt = now; S.clients.set(c.id, c); S.store.saveClient(clone(c)); });
  const restored = await restoreFiles(data.files);
  render();
  toast(`Відновлено: ${cnt} ${plural(cnt, 'клієнт', 'клієнти', 'клієнтів')}${restored ? `, файлів: ${restored}` : ''}`);
}

const EMBEDDED = (window.AMFLOW_FIREBASE_CONFIG && window.AMFLOW_FIREBASE_CONFIG.apiKey) ? window.AMFLOW_FIREBASE_CONFIG : null;
function getConfig() {
  if (EMBEDDED) return EMBEDDED;
  try { return JSON.parse(localStorage.getItem(LS.config)) || null; } catch { return null; }
}
function parseFirebaseConfig(text) {
  const t = String(text || '');
  try { const j = JSON.parse(t); if (j && j.apiKey) return j; } catch {}
  const out = {};
  const re = /(apiKey|authDomain|projectId|storageBucket|messagingSenderId|appId|measurementId)\s*["']?\s*:\s*["']([^"']+)["']/g;
  let m; while ((m = re.exec(t))) out[m[1]] = m[2];
  return out.apiKey && out.projectId && out.appId ? out : null;
}
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Не вдалося завантажити ' + src)); document.head.appendChild(s); });
}

      ${EMBEDDED ? '' : `<button type="button" class="btn ghost sm" id="lg-change">Змінити підключення</button>`}</div>
  </form>`);
  const showErr = m => { $('#lg-err').innerHTML = m ? `<div class="err-box">${esc(m)}</div>` : ''; };
  $('#lg-email').focus();
  $('#login').onsubmit = async e => {
    e.preventDefault();
    const email = $('#lg-email').value.trim(), pass = $('#lg-pass').value;
    if (!email || !pass) return showErr('Введіть email і пароль');
    const b = $('#lg-btn'); b.disabled = true; b.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;border-top-color:#fff"></div>';
    try { await S.ctx.FB.signInWithEmailAndPassword(S.ctx.auth, email, pass); }
    catch (er) { showErr(AUTH_ERRORS[er.code] || er.message); b.disabled = false; b.textContent = 'Увійти'; }
  };
  $('#lg-reset').onclick = async () => {
    const email = $('#lg-email').value.trim();
    if (!email) { showErr('Впишіть email, і ми надішлемо лист для зміни пароля'); $('#lg-email').focus(); return; }
    try { await S.ctx.FB.sendPasswordResetEmail(S.ctx.auth, email); $('#lg-err').innerHTML = `<div class="callout">${icon('info', 16)}<div>Якщо акаунт існує, лист для зміни пароля надіслано на ${esc(email)}.</div></div>`; }
    catch (er) { showErr(AUTH_ERRORS[er.code] || er.message); }
  };
  const ch = $('#lg-change');
  if (ch) ch.onclick = () => { localStorage.removeItem(LS.config); localStorage.removeItem(LS.mode); location.reload(); };
}

async function startCloud(cfg) {
  showLoading('Підключення до Firebase…');
  try {
    if (!window.FB) await loadScript('vendor/firebase.js');
    const FB = window.FB;
    const app = FB.initializeApp(cfg);
    const auth = FB.getAuth(app);
    let db;
    try { db = FB.initializeFirestore(app, { localCache: FB.persistentLocalCache({ tabManager: FB.persistentMultipleTabManager() }), ignoreUndefinedProperties: true }); }
    catch (e) { console.warn('persistent cache unavailable', e); db = FB.initializeFirestore(app, { ignoreUndefinedProperties: true }); }
    S.ctx = { FB, app, auth, db, config: cfg };
    FB.onAuthStateChanged(auth, user => {
      if (user) {
        if (S.user && S.user.uid === user.uid) return;
        S.user = user; S.ctx.user = user;
        startApp(new CloudStore(S.ctx));
      } else {
        if (S.user) { location.reload(); return; }
        showLogin();
      }
    });
  } catch (e) {
    console.error(e);
    screen(`<div class="card auth-card">${brandBlock}<h2>Не вдалося підключитися</h2><div class="err-box">${esc(e.message)}</div>
      <div class="row"><button class="btn" id="re-try">${icon('refresh', 15)}Спробувати ще</button><span class="sp"></span>${EMBEDDED ? '' : `<button class="btn ghost" id="re-cfg">Змінити підключення</button>`}</div></div>`);
    $('#re-try').onclick = () => location.reload();
    const rc = $('#re-cfg'); if (rc) rc.onclick = () => { localStorage.removeItem(LS.config); localStorage.removeItem(LS.mode); location.reload(); };
  }
}

async function startApp(store) {
  S.store = store;
  S.sync = store.status();
  store.onStatus = st => { S.sync = st; updateSyncEl(); };
  showLoading('Завантажую дані…');
  try {
    const { settings, clients } = await store.init(onRemote);
    S.settings = normalizeSettings(settings ? clone(settings) : null);
    S.clients.clear();
    clients.forEach(c => S.clients.set(c.id, normalizeClient(clone(c))));
  } catch (e) {
    console.error(e);
    const denied = e && (e.code === 'permission-denied' || /permission/i.test(e.message));
    screen(`<div class="card auth-card wide">${brandBlock}<h2>Не вдалося завантажити дані</h2>
      <div class="err-box">${esc(e.code || '')} ${esc(e.message || e)}</div>
      ${denied ? `<div class="callout amber">${icon('lock', 16)}<div>Firestore відхилив доступ. Перевірте, що правила з <span class="code-chip">firestore.rules</span> опубліковані й email у них збігається з тим, яким ви входите${S.user ? ` (<b>${esc(S.user.email)}</b>)` : ''}.</div></div>` : ''}
      <div class="row"><button class="btn" id="re-try">${icon('refresh', 15)}Спробувати ще</button><span class="sp"></span>${store.mode === 'cloud' ? `<button class="btn ghost" id="re-out">${icon('logout', 15)}Вийти</button>` : ''}</div></div>`);
    $('#re-try').onclick = () => location.reload();
    const ro = $('#re-out'); if (ro) ro.onclick = async () => { await S.ctx.FB.signOut(S.ctx.auth); location.reload(); };
    return;
  }
  document.body.innerHTML = shellHtml();
  setupSortables($('#main'));
  lastPath = location.hash.split('?')[0];
  render();
  updateSyncEl();
}

async function logout() {
  if (!S.ctx) return;
  const ok = await confirmDialog({ title: 'Вийти з акаунта?', text: 'Локальну копію даних на цьому пристрої буде очищено. У хмарі все залишиться.', confirm: 'Вийти', tone: 'amber', ic: 'logout' });
  if (!ok) return;
  flushSaves();
  const t0 = Date.now();
  while (S.store.pending > 0 && Date.now() - t0 < 5000) await new Promise(r => setTimeout(r, 200));
  if (S.store.pending > 0) {
    const force = await confirmDialog({ title: 'Є несинхронізовані зміни', text: 'Схоже, немає інтернету: частина змін ще не потрапила в хмару. Якщо вийти зараз, вони пропадуть.', confirm: 'Все одно вийти' });
    if (!force) return;
  }
  showLoading('Виходжу…');
  try { S.store.stop(); } catch {}
  try { await S.ctx.FB.signOut(S.ctx.auth); } catch {}
  try { await S.ctx.FB.terminate(S.ctx.db); await S.ctx.FB.clearIndexedDbPersistence(S.ctx.db); } catch (e) { console.warn(e); }
  history.replaceState(null, '', location.pathname);
  location.reload();
}

function boot() {
  let theme = null; try { theme = localStorage.getItem(LS.theme); } catch {}
  applyTheme(theme || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  const cfg = getConfig();
  let mode = null; try { mode = localStorage.getItem(LS.mode); } catch {}
  if (!mode && EMBEDDED) mode = 'cloud';
  if (mode === 'local') return startApp(new LocalStore());
  if (mode === 'cloud' && cfg) return startCloud(cfg);
  showWelcome();
}
boot();

})();
</script>
